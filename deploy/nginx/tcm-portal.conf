# 中医专科辅助诊疗平台 · 门户(tcm.llixz.cn)
server {
    listen 80;
    listen [::]:80;
    server_name tcm.llixz.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/tcm-platform/certbot-webroot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tcm.llixz.cn;

    ssl_certificate /etc/nginx/ssl/tcm.llixz.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/tcm.llixz.cn/tcm.llixz.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/tcm-platform/dist;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    location = /healthz { access_log off; return 200 'ok'; }

    # 静态资源(带 hash,长期缓存)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location /pages/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 后端 API(合并后端,含 /api/v1/surgery /api/v1/visits /api/v1/stats 等)
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # 上传图片(后端静态)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
