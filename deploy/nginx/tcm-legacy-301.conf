# 旧域名 301 → 门户模块(切换时启用,替换 dan-alchemy.conf / erke.conf / tcm-surgery.conf / zhilou-assistant.conf)
# 启用前备份原 4 个 conf;ACME 续期保留。

server {
    listen 80;
    listen [::]:80;
    server_name dan.llixz.cn erke.llixz.cn cy.llixz.cn zl.llixz.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/tcm-platform/certbot-webroot;
    }
    location / { return 404; }
}

# dan → 丹药模块
server {
    listen 443 ssl;
    server_name dan.llixz.cn;
    ssl_certificate /etc/nginx/ssl/dan.llixz.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/dan.llixz.cn/dan.llixz.cn.key;
    location /.well-known/acme-challenge/ { root /var/www/tcm-platform/certbot-webroot; }
    location / { return 301 https://tcm.llixz.cn/alchemy$is_args$args; }
}
# erke → 儿科模块
server {
    listen 443 ssl;
    server_name erke.llixz.cn;
    ssl_certificate /etc/nginx/ssl/erke.llixz.cn/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/erke.llixz.cn/erke.llixz.cn.key;
    location /.well-known/acme-challenge/ { root /var/www/tcm-platform/certbot-webroot; }
    location / { return 301 https://tcm.llixz.cn/pediatrics$is_args$args; }
}
# cy → 疮疡模块
server {
    listen 443 ssl;
    server_name cy.llixz.cn;
    ssl_certificate /etc/letsencrypt/live/cy.llixz.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cy.llixz.cn/privkey.pem;
    location /.well-known/acme-challenge/ { root /var/www/tcm-platform/certbot-webroot; }
    location / { return 301 https://tcm.llixz.cn/surgery$is_args$args; }
}
# zl → 痔漏模块
server {
    listen 443 ssl;
    server_name zl.llixz.cn;
    ssl_certificate /etc/letsencrypt/live/zl.llixz.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zl.llixz.cn/privkey.pem;
    location /.well-known/acme-challenge/ { root /var/www/tcm-platform/certbot-webroot; }
    location / { return 301 https://tcm.llixz.cn/anorectal$is_args$args; }
}
