name: zhilou-clinic

services:
  db:
    image: postgres:16-alpine
    container_name: zhilou_db
    environment:
      POSTGRES_DB: zhilou_clinic
      POSTGRES_USER: zhilou_user
      POSTGRES_PASSWORD: Alfg4l1jpkFkktWB3LFRUi7A
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhilou_user -d zhilou_clinic"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zhilou_redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhilou_clinic_backend
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8001:8000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zhilou_clinic_frontend
    ports:
      - "127.0.0.1:8088:80"
    restart: always
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
